services:
  postgres:
    image: postgres:16-alpine
    container_name: yukitrace-pg-dev
    environment:
      POSTGRES_USER: yukitrace
      POSTGRES_PASSWORD: yukitrace
      POSTGRES_DB: yukitrace
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yukitrace"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_dev:

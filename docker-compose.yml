services:
  app:
    build:
      context: .
      target: runner
    image: yukitrace:latest
    container_name: yukitrace-app
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      DATABASE_URL: postgresql://${POSTGRES_USER:-yukitrace}:${POSTGRES_PASSWORD:-yukitrace}@postgres:5432/${POSTGRES_DB:-yukitrace}?schema=public
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      # 未配置 OSS 时图片落在本地卷
      - uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: .
      target: migrate
    image: yukitrace-migrate:latest
    container_name: yukitrace-migrate
    volumes:
      # 挂载迁移目录：新增迁移时无需重建 migrate 镜像
      - ./prisma:/app/prisma:ro
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yukitrace}:${POSTGRES_PASSWORD:-yukitrace}@postgres:5432/${POSTGRES_DB:-yukitrace}?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: yukitrace-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yukitrace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yukitrace}
      POSTGRES_DB: ${POSTGRES_DB:-yukitrace}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yukitrace}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
